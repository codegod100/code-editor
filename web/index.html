<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="A browser-based workspace for editing projects and working with Codex.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon-cloud-code-editor.png">
  <link rel="apple-touch-icon" href="icons/cloud-code-editor-192.png">
  <title>Cloud Code Editor</title>
</head>
<body>
  <script type="module">
    import * as TreeSitter from './assets/tree-sitter/tree-sitter.js';
    window.TreeSitter = TreeSitter;
  </script>
  <script src="tree-sitter-highlighter.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Flutter's bootstrap owns the service-worker registration.  This only
      // removes the retired hand-written worker, which cached authentication
      // pages under asset URLs and competed with Flutter's generated worker.
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (const registration of registrations) {
          if (new URL(registration.active?.scriptURL ?? registration.waiting?.scriptURL ?? registration.installing?.scriptURL ?? '', location.href).pathname.endsWith('/service-worker.js')) {
            registration.unregister();
          }
        }
      });
    }
  </script>
</body>
</html>
