name: Publish CI Base Image

on:
  push:
    branches:
      - main
    paths:
      - .github/ci/Dockerfile
      - .github/workflows/publish-ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/code-editor-ci

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out merged revision
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CI base image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .github/ci
          push: true
          build-args: MODAL_VERSION=1.5.4
          tags: ${{ env.IMAGE_NAME }}:v1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
