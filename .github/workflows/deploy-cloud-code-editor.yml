name: Deploy Cloud Code Editor

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/ci/Dockerfile
      - .github/workflows/publish-ci-image.yml

permissions:
  contents: read
  packages: read

jobs:
  resolve-ci-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - id: image
        name: Validate pinned CI image digest
        env:
          CI_IMAGE_DIGEST: ${{ vars.CODE_EDITOR_CI_IMAGE_DIGEST }}
        run: |
          if [[ ! "$CI_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "CODE_EDITOR_CI_IMAGE_DIGEST must be a sha256 digest from Publish CI Base Image." >&2
            exit 1
          fi
          echo "image=ghcr.io/${{ github.repository_owner }}/code-editor-ci@$CI_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve-ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      CODE_EDITOR_APP_URL: https://codegod100--cloud-code-editor-serve.modal.run
      # Deploy the revision checked out by this workflow. The local launcher
      # normally fetches origin/main before deploying; CI has already checked
      # out the merge commit that triggered this run.
      CODE_EDITOR_DEPLOYING_ORIGIN_MAIN: "1"
      CODE_EDITOR_RELEASE_VERSION: ${{ github.sha }}

    steps:
      - name: Check out merged revision
        uses: actions/checkout@v6

      - name: Deploy to Modal
        run: modal deploy --env main --tag "$GITHUB_SHA" deploy.py

      - name: Verify Modal deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            app_state="$(
              modal app list --env main --json | python -c '
          import json
          import sys

          apps = json.load(sys.stdin)
          matches = [
              app for app in apps
              if app.get("description") == "cloud-code-editor"
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one cloud-code-editor app, found {len(matches)}"
              )
          print(matches[0].get("state", ""))
          '
            )"
            if [[ "$app_state" == "deployed" ]]; then
              echo "Modal API verified cloud-code-editor is deployed."
              if health_release="$(python -c '
          import json
          import os
          from urllib.request import urlopen

          with urlopen(os.environ["CODE_EDITOR_APP_URL"] + "/health", timeout=60) as response:
              health = json.load(response)
          if not isinstance(health, dict) or health.get("status") != "ok":
              raise SystemExit(
                f"unexpected health response: {health!r}"
              )
          release = health.get("release")
          if not isinstance(release, str):
              raise SystemExit(f"health response has no release: {health!r}")
          print(release)
          ')"; then
                if [[ "$health_release" == "$GITHUB_SHA" ]]; then
                  echo "Health endpoint verified deployed release $GITHUB_SHA."
                  exit 0
                fi
                echo "Health endpoint still serves $health_release; waiting for $GITHUB_SHA (attempt $attempt/30)"
              else
                echo "Health endpoint is not ready yet (attempt $attempt/30)"
              fi
              sleep 10
              continue
            fi
            echo "Modal API reports cloud-code-editor state: $app_state (attempt $attempt/30)"
            sleep 10
          done
          echo "cloud-code-editor did not serve release $GITHUB_SHA within 5 minutes." >&2
          exit 1
